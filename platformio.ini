[env:esp32-s3-fh4r2]
platform = espressif32@6.9.0
; ESP32-S3FH4R2: 4MB Quad Flash + 2MB Quad PSRAM.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.offset_address = 0x20000
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
extra_scripts = post:extra_scripts/merge_firmware.py
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    h2zero/NimBLE-Arduino@2.3.6
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; Application serial diagnostics are compiled out; /status remains available.
    -DAPP_ENABLE_SERIAL_LOGS=0
    ; Two Legacy advertising instances use IDs 0 and 1. Both on-air packets
    ; remain Legacy (no Extended payload).
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    ; NimBLE-Arduino supplies one base instance; one additional instance gives
    ; the two fixed virtual signals IDs 0 and 1.
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
    ; One Central link to the BMS plus at most two virtual client links.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
    ; Include readable NimBLE host/HCI error text in diagnostics.
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=1
